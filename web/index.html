<!DOCTYPE html>
<html>
<head>

    This is a placeholder for base href that will be replaced by the value of

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Explore personalized astrology consultations and spiritual poojas at Guru Kripa Astro Science. Experts in KP Astrology, Vedic Astrology, Negative Energy Extraction, Numerology, and Gemmology.">
  <meta name="keywords" content="Guru Kripa Astro Science, KP Astrology Consultation, Vedic Astrology, Spiritual Poojas, Negative Energy Extraction, Energy Cleansing, Medical Astrology, Numerology, Gemmology, Birth-Time Rectification, Prashna Astrology">
  <meta name="theme-color" content="#1A1D20">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Guru Kripa Astro Science | KP Astrology &amp; Spiritual Pooja Services">
  <meta property="og:description" content="Personalized KP &amp; Vedic astrology consultations, spiritual poojas and negative energy cleansing. Book online via WhatsApp.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Guru Kripa">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Guru Kripa Astro Science | KP Astrology &amp; Spiritual Pooja Services</title>
  <link rel="manifest" href="manifest.json">
  <style>
    #gk-loader{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;
      background:radial-gradient(circle at 50% 40%,#2a2e34 0%,#1A1D20 55%,#121417 100%);z-index:9999;transition:opacity .6s ease}
    #gk-loader.gone{opacity:0;pointer-events:none}
    #gk-loader .orbit{position:relative;width:110px;height:110px;border-radius:50%;border:1px dashed rgba(255,255,255,.25);animation:gkspin 6s linear infinite}
    #gk-loader .orbit:before{content:"";position:absolute;inset:18px;border-radius:50%;border:1px solid rgba(201,164,106,.45)}
    #gk-loader .orbit:after{content:"";position:absolute;top:-5px;left:50%;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:#C9A46A;box-shadow:0 0 14px 4px rgba(201,164,106,.6)}
    #gk-loader .core{position:absolute;width:14px;height:14px;border-radius:50%;background:#F3E3C3;box-shadow:0 0 30px 10px rgba(201,164,106,.45);top:48px}
    #gk-loader .name{font:600 13px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:.42em;color:#C9A46A;text-align:center;padding:0 16px}
    #gk-loader .sub{font:400 11px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:.3em;color:rgba(255,255,255,.45);margin-top:-18px}
    #gk-loader .wrap{position:relative;display:flex;justify-content:center}
    .gk-star{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;animation:gktw 3s ease-in-out infinite}
    @keyframes gkspin{to{transform:rotate(360deg)}}
    @keyframes gktw{0%,100%{opacity:.15}50%{opacity:.9}}
  </style>

</head>
<body style="background:#1A1D20;margin:0">
  <div id="gk-loader" aria-label="Loading Guru Kripa Astro Science">
    <div class="wrap"><div class="orbit"></div><div class="core"></div></div>
    <div class="name">GURU KRIPA</div>
    <div class="sub">ASTRO SCIENCE</div>
  </div>
  <script>
    (function () {
      var l = document.getElementById('gk-loader');
      for (var i = 0; i < 60; i++) {
        var st = document.createElement('span');
        st.className = 'gk-star';
        st.style.left = Math.random() * 100 + '%';
        st.style.top = Math.random() * 100 + '%';
        st.style.animationDelay = (Math.random() * 3) + 's';
        l.appendChild(st);
      }
      window.addEventListener('flutter-first-frame', function () {
        l.classList.add('gone');
        setTimeout(function () { l.remove(); }, 700);
      });
    })();
  </script>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
